<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TARG Family Day Home — Personal Reference Questionnaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF1F0; --card: #FFFFFF; --ink: #1E2624; --ink-soft: #5B655F;
    --line: #DDE3DF; --accent: #1F4E45; --accent-2: #163A33; --gold: #C79A3E;
    --readonly-bg: #F4F6F4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14201C; } }
  :root[data-theme="dark"] { --bg: #14201C; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%; background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink); padding: 20px 12px 50px; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 640px; }

  .masthead { text-align: center; color: #fff; background: linear-gradient(160deg, var(--accent), var(--accent-2)); border-radius: 14px 14px 0 0; padding: 22px 20px 18px; }
  .masthead .logo { height: 40px; margin-bottom: 8px; }
  .masthead .org { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .masthead .title { font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 19px; margin-top: 4px; }
  .progress-track { height: 6px; background: rgba(255,255,255,0.18); border-radius: 999px; margin-top: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width 0.25s ease; }
  .progress-label { font-size: 11px; opacity: 0.85; margin-top: 8px; }

  .card { background: var(--card); border-radius: 0 0 14px 14px; box-shadow: 0 14px 34px rgba(0,0,0,0.12); padding: 26px 20px 24px; }
  @media (min-width: 520px) { .card { padding: 32px 34px 28px; } }

  .step-title { font-family: 'Lora', Georgia, serif; font-weight: 600; font-size: 18px; margin: 0 0 4px; color: var(--accent-2); }
  .step-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }

  .field { margin-bottom: 18px; }
  .field label.f-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="tel"], .field input[type="email"], .field input[type="date"], .field textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: #fff;
    border: 1.5px solid var(--line); border-radius: 9px; padding: 10px 12px;
  }
  .field textarea { min-height: 80px; resize: vertical; line-height: 1.5; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }

  .row-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 480px) { .row-2 { grid-template-columns: 1fr 1fr; } }

  fieldset { border: none; margin: 0 0 18px; padding: 0; }
  legend { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 8px; padding: 0; line-height: 1.4; }

  .choice-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .choice .pill { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13.5px; color: var(--ink); background: #fff; user-select: none; }
  .choice input:checked + .pill { background: var(--accent); border-color: var(--accent); color: #fff; }
  .choice input:focus-visible + .pill { outline: 2px solid var(--gold); outline-offset: 2px; }

  .trait-row { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .trait-row .t-title { font-weight: 600; font-size: 13.5px; margin-bottom: 10px; }

  .legal-block { background: var(--readonly-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 13px; line-height: 1.65; color: var(--ink); margin-bottom: 18px; }
  .legal-block p { margin: 0 0 10px; } .legal-block p:last-child { margin-bottom: 0; }

  .divider { border: none; border-top: 1px dashed var(--line); margin: 20px 0; }

  .sig-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .sig-label .t { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .sig-clear { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 600; cursor: pointer; }
  .sig-box { position: relative; border: 1.5px solid var(--line); border-radius: 9px; background: var(--readonly-bg); touch-action: none; overflow: hidden; }
  .sig-box canvas { display: block; width: 100%; height: 160px; touch-action: none; }
  .sig-placeholder { position: absolute; left: 14px; bottom: 30px; font-family: 'Lora', serif; font-style: italic; color: #A7AFA9; font-size: 14px; pointer-events: none; }
  .sig-baseline { position: absolute; left: 14px; right: 14px; bottom: 24px; border-top: 1.5px solid var(--ink-soft); }

  .nav-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn { appearance: none; border: none; border-radius: 999px; padding: 12px 20px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; flex: 1; }
  .btn:active { transform: scale(0.98); }
  .btn-back { background: var(--readonly-bg); color: var(--ink); border: 1.5px solid var(--line); }
  .btn-next { background: var(--accent); color: #fff; }
  .btn-download { background: var(--gold); color: #2A2110; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-line { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 10px; min-height: 16px; }
  .foot-note { text-align: center; font-size: 11px; color: #8B9490; margin-top: 18px; line-height: 1.6; }

  .form-page { display: none; } .form-page.active { display: block; }

  @media print {
    body { background: #fff; }
    .nav-row, .status-line, .foot-note { display: none !important; }
    .form-page { display: block !important; page-break-after: always; }
    .card { box-shadow: none; }
  }
</style>
</head>
